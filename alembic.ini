# ==============================================================================
# CourtIQ: Master Alembic Configuration File
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Sys.path prepending
prepend_sys_path = .

# Timezone for generated migration dates (leave unset for local time)
# timezone = UTC

# Max line length for formatters
# max_line_length = 88

# Target database connection URL (overridden dynamically in env.py from Settings)
sqlalchemy.url = postgresql+psycopg://courtiq_migrator@127.0.0.1:5432/courtiq

[post_write_hooks]
# Post-write hooks for linters can be added here

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

